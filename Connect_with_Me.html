    <link rel="icon" href="Resources/favicon.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1c1c1e, #2e2e2e);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background-color: #333;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            width: 100%;
            text-align: center;
            overflow: hidden;
            position: relative;
            padding: 50px 40px;
        }

        .logo {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 50px;
            height: 50px;
            opacity: 0.8;
        }

        .profile-header {
            margin-top: 50px;
            margin-bottom: 35px;
        }

        .profile-img {
            border-radius: 50%;
            width: 140px;
            height: 140px;
            border: 5px solid #dc143c;
            margin-bottom: 25px;
            object-fit: cover;
        }

        .profile-name {
            font-size: 36px;
            margin: 15px 0 10px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .profile-post {
            font-size: 18px;
            color: #dc143c;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .profile-institution {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 25px;
        }

        .profile-about {
            font-size: 15px;
            color: #ccc;
            line-height: 1.7;
            margin-bottom: 35px;
            padding: 0 20px;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }

        .profile-contact {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .round-btn {
            background-color: #dc143c;
            border: none;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            display: inline-block;
        }

        .round-btn:hover {
            background-color: #b01030;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.5);
        }

        .profile-social-media {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .social-media-link img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            transition: opacity 0.3s ease;
        }

        .social-media-link img:hover {
            opacity: 0.8;
        }

        .profile-contact-info,
        .profile-location {
            font-size: 15px;
            color: #ccc;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 8px 15px;
            border-radius: 8px;
        }

        .profile-contact-info:hover,
        .profile-location:hover {
            color: #dc143c;
            background: rgba(220, 20, 60, 0.1);
        }

        .contact-icon {
            font-size: 18px;
            color: #dc143c;
        }

        .protected-info {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .qr-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .qr-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            position: relative;
            max-width: 400px;
            width: 90%;
        }

        .qr-close {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            color: #666;
            font-size: 28px;
            font-weight: 300;
            transition: color 0.3s;
        }

        .qr-close:hover {
            color: #333;
        }

        #qrcode {
            margin: 20px 0;
        }

        #qrcode svg {
            width: 280px;
            height: 280px;
        }

        @media (max-width: 768px) {
            .profile-card {
                padding: 30px 20px;
                max-width: 100%;
                border-radius: 15px;
            }



            .logo {
                width: 45px;
                height: 45px;
                top: 20px;
                left: 20px;
            }

            .profile-header {
                margin-top: 40px;
            }

            .profile-img {
                width: 120px;
                height: 120px;
                border: 4px solid #dc143c;
            }

            .profile-name {
                font-size: 28px;
            }

            .profile-post {
                font-size: 15px;
            }

            .profile-institution {
                font-size: 14px;
            }

            .profile-about {
                font-size: 13px;
            }

            .round-btn {
                padding: 10px 20px;
                font-size: 13px;
            }

            .social-media-link img {
                width: 32px;
                height: 32px;
            }

            .profile-contact-info,
            .profile-location {
                font-size: 14px;
            }
        }
    </style>
</head>

        function generateQR() {
            const currentURL = window.location.href;
            const qrCode = qrcode(0, 'M');
            qrCode.addData(currentURL);
            qrCode.make();
            const qrElement = document.getElementById('qrcode');
            qrElement.innerHTML = qrCode.createSvgTag({ scalable: true });
            document.getElementById('qrModal').style.display = 'flex';
        }

        function downloadQR() {
            const data = getContactData();
            const svg = document.getElementById('qrcode').querySelector('svg');
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');

            const img = new Image();
            img.onload = function () {
                context.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = img.width;
                canvas.height = img.height;
                context.drawImage(img, 0, 0);

                canvas.toBlob(function (blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${data.name}-QR.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
        }
